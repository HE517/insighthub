# Render Blueprint for InsightHub (M4 B7 packaging, B11 deploy).
#
# The V1 topology is fixed by docs/DECISIONS.md D-082 D2: **one Render Web Service, one Node
# process, one origin**. The React production build is served by the same Express process as the
# API and the WebSocket (`apps/server/src/static-hosting.ts`), so there is no second frontend
# origin and no cross-site cookie. Persistent data lives on the attached disk at an **absolute**
# path; the ephemeral filesystem is never the store. No database, Redis, worker or second region
# is introduced here.
#
# Every value below is either a non-secret constant or a **self-reference** to a Render default
# variable. Secrets are `sync: false`: Render prompts for them once, during the initial Blueprint
# creation, and never stores them in this file.

services:
  - type: web
    name: insighthub
    runtime: node
    region: oregon
    # 1 CPU / 2 GB: the build runs `tsc` + Vite for two workspaces, and 512 MB is tight for that.
    # A staging deployment can be downsized after the first successful build.
    plan: 1c-2g
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    # One disk, mounted at an absolute path. `INSIGHTHUB_DATA_PATH` below points at it, and the
    # production startup gate refuses a relative path or the development default (B3), so a
    # redeploy or restart cannot silently start with an empty store.
    disk:
      name: insighthub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Production mode: enables the B3 config gate, `trust proxy` (Render terminates TLS), the
      # static-build requirement and the absence of the demo bootstrap route.
      - key: NODE_ENV
        value: production
      # `node:sqlite` (the server's only database) exists from Node 22.5, so the runtime is pinned
      # rather than left to the platform default. The root `engines` field states the same floor.
      - key: NODE_VERSION
        value: '22.14.0'
      # Render routes traffic to the service's external interface, not to loopback. The server's
      # development default is 127.0.0.1 (safe on a laptop); a deployment must bind 0.0.0.0.
      # `PORT` is injected by Render and read by `config.ts` unchanged.
      - key: HOST
        value: 0.0.0.0
      # Production identity (D-082 D1): Clerk only. `AUTH_MODE=demo` is refused in production.
      - key: AUTH_MODE
        value: clerk
      # The durable store lives on the mounted disk (absolute, persistent). The B3 gate refuses
      # the development default and any relative path.
      - key: INSIGHTHUB_DATA_PATH
        value: /var/data
      # The browser origin allowed to call the API and open the WebSocket.
      #
      # This is a **self-reference** to Render's own `RENDER_EXTERNAL_URL`, which is exactly
      # `https://<service>.onrender.com` (Render documents self-references for default variables).
      # That keeps B3's "explicit https origin" rule satisfiable without asking the owner to guess
      # the hostname before the service exists, and it stays correct if the name is adjusted.
      #
      # After attaching a custom domain, replace this entry with that domain in the Dashboard:
      # the allowed browser origin is the origin the page is actually served from.
      - key: CORS_ORIGIN
        fromService:
          name: insighthub
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Server-only Clerk secret (session verification). A clerk server refuses to start without
      # it (B2/B3). Prompted once at Blueprint creation; never committed.
      - key: CLERK_SECRET_KEY
        sync: false
      # Public Clerk publishable key. Consumed by the web build (Vite inlines VITE_* at build
      # time) and by the server-side Clerk client, so Render must have it during `pnpm build` as
      # well as at runtime. Not a secret, but environment-specific.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # AI is intentionally **disabled** for B11: no `AI_PROVIDER` variable and no OpenAI
      # credential here. The server starts with `ai disabled` and the existing 503 behaviour.
      # B12 enables it by adding, in the Render Dashboard (not in this file):
      #   AI_PROVIDER=openai, OPENAI_API_KEY=<key>, OPENAI_MODEL=gpt-5.6-luna
      # Daily logical backups (M4 B8, D-082 D2): the server runs `VACUUM INTO` once a day and
      # prunes beyond seven days. It runs in-process because a Render cron job cannot mount this
      # service's disk. Backups stay on the same disk (not an off-site copy: an operator task).
      - key: BACKUP_ENABLED
        value: 'true'
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_RETENTION_DAYS
        value: '7'
