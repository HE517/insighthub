# B11a FREE STAGING SMOKE — EPHEMERAL, TEST-ONLY.
#
# This file is **not** the V1 production topology. It exists only while no payment method is
# available: Render free instances cannot attach a persistent disk, so the SQLite store lives in
# /tmp and is lost on every deploy, restart or spin-down. Data written here is disposable; do not
# let real users type into this service.
#
# What this deployment is allowed to prove (B11a): HTTPS, WSS, same-origin React + API, Clerk
# sign-in, the production config gate, /health, /ready, and "demo bootstrap is absent".
# What it is NOT allowed to prove: persistence across restart, deployed backup/restore, or any
# production-readiness claim. Those stay OPEN (D-083).
#
# Restoring paid production is **not** a path switch: create a separate production Blueprint that
# points at `render.yaml` (service name `insighthub`), verify it, and then delete/disconnect this
# staging service explicitly. Switching an existing Blueprint leaves the old resource in place.

services:
  - type: web
    name: insighthub-staging
    runtime: node
    region: oregon
    # Free plan: 0.1 CPU / 512 MB, no disk, spins down after inactivity (cold start on wake).
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      # Production mode: the B3 gate, `trust proxy`, the static-build requirement, and the
      # absence of the demo bootstrap route all apply exactly as they would in production.
      - key: NODE_ENV
        value: production
      # `node:sqlite` exists from Node 22.5; pin the runtime instead of trusting a default.
      - key: NODE_VERSION
        value: '22.14.0'
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: clerk
      # Absolute (the B3 gate refuses relative paths and the development default) but EPHEMERAL:
      # /tmp is not a disk, so every deploy starts from an empty store.
      - key: INSIGHTHUB_DATA_PATH
        value: /tmp/insighthub-data
      # Self-reference to Render's own https URL for this service, so the allowed browser origin
      # is correct without guessing the hostname.
      - key: CORS_ORIGIN
        fromService:
          name: insighthub-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # The only two values Render prompts for at Blueprint creation.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # No disk: a backup would be as ephemeral as the database it copies. Off, and not claimed.
      - key: BACKUP_ENABLED
        value: 'false'
      # AI on staging (M4 B12/B13). The client only calls `/api/ai/suggest` when the build carries
      # `VITE_AI_PROVIDER=remote`; without it the deterministic local provider answers in the
      # browser and the real OpenAI path is never exercised. The key itself is `sync: false` and
      # lives only in the Dashboard; a missing key makes the production gate refuse to start
      # (`OPENAI_API_KEY_MISSING`), which is the intended fail-closed behaviour.
      - key: VITE_AI_PROVIDER
        value: remote
      # D-085: the provider is configuration, not code. Staging stays on OpenAI until a
      # KIMI_API_KEY exists in the Dashboard; switching is then a two-variable change
      # (AI_PROVIDER=kimi, AI_MODEL=kimi-k3) with no application change. Keeping a provider here
      # whose key is absent would fail startup with *_API_KEY_MISSING, which is correct but
      # takes staging down for no reason.
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
